<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>効果音えらび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f7f4ee; --text: #1f1d1a; --muted: #8b857b; --line: #e2ddd3; --accent: #e5533d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1b1a18; --text: #efe9df; --muted: #9a9286; --line: #36332e; } }
  :root[data-theme="dark"] { --bg: #1b1a18; --text: #efe9df; --muted: #9a9286; --line: #36332e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Zen Maru Gothic", system-ui, sans-serif; font-weight: 500; line-height: 1.6; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 160px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  section { margin-bottom: 28px; }
  h2 { font-size: 17px; margin: 0 0 2px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .snd {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 12px 7px 8px; border: none; border-radius: 99px;
    background: color-mix(in srgb, var(--text) 7%, var(--bg)); color: var(--text);
    font: inherit; font-size: 13px; cursor: pointer;
    transition: background 0.15s, transform 0.15s;
  }
  .snd:hover { background: color-mix(in srgb, var(--text) 13%, var(--bg)); }
  .snd:active { transform: scale(0.96); }
  .snd .play { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--text); color: var(--bg); font-size: 11px; }
  .snd.is-on { background: var(--accent); color: #fff; }
  .snd.is-on .play { background: #fff; color: var(--accent); }
  .snd.is-playing .play { animation: pulse 0.3s ease; }
  @keyframes pulse { 50% { transform: scale(1.25); } }
  .none { background: none; box-shadow: inset 0 0 0 1.5px var(--line); color: var(--muted); }
  .foot {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--bg); border-top: 1.5px solid var(--line);
    padding: 12px 16px;
  }
  .foot-in { max-width: 900px; margin: 0 auto; display: flex; gap: 12px; align-items: flex-start; }
  #summary { flex: 1; margin: 0; font-size: 12.5px; white-space: pre-wrap; color: var(--muted); max-height: 96px; overflow: auto; }
  #copy { flex: none; padding: 10px 18px; border: none; border-radius: 99px; background: var(--accent); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>効果音えらび</h1>
  <p class="lead">4回目です。属性でまとめるのをやめて、まだ決まっていない超能力を1つずつ並べました。どの音も、0.6秒からゆっくり小さくなって消えます（ゲームでも同じ消え方にします）。押すと鳴ります。気に入った音をもう一度押すと選べます（赤くなる）。1つの場面に、2つ以上選んでもかまいません（そのときは、毎回ランダムに鳴らします）。最後に、下の「選んだ結果をコピー」を押して、貼り付けて送ってください。</p>
  <div id="slots"></div>
</main>
<div class="foot"><div class="foot-in"><pre id="summary">まだ選んでいません</pre><button id="copy" type="button">選んだ結果をコピー</button></div></div>
<script>
// 2回目：楽器の録音（vc_、VCSL）を足した。置く音と選ぶ音は決まったので外した
const JA = {
  bd_ff: '大太鼓（強）', bd_f: '大太鼓', timp_hit: 'ティンパニ', timp_low: 'ティンパニ（低）', gong_fff: '銅鑼（強）', gong_mf: '銅鑼', crash_ff: 'シンバル', crash_short: 'シンバル（短）',
  cajon_fff: 'カホン（強）', cajon_f: 'カホン', frame_hit: 'フレームドラム', frame_muted: 'フレームドラム（止め）', wood_ff: 'ウッドブロック（強）', wood_f: 'ウッドブロック', wood_pp: 'ウッドブロック（弱）',
  claves_v3: 'クラベス', claves_v1: 'クラベス（弱）', slit_hi: 'スリットドラム（高）', slit_lo: 'スリットドラム（低）', tom_stick: 'タム', tom_mallet: 'タム（マレット）', slapstick: 'むち', slapstick_q: 'むち（弱）',
  glock_c7: '鉄琴（高）', glock_c6: '鉄琴', glock_g6: '鉄琴（中）', belltree_e5: 'ベルツリー（1音）', belltree_stroke: 'ベルツリー（流し）', belltree_stroke3: 'ベルツリー（流し2）', triangle: 'トライアングル', triangle_muted: 'トライアングル（止め）',
  finger_cym: 'フィンガーシンバル', agogo_hi: 'アゴゴ（高）', agogo_lo: 'アゴゴ（低）', wineglass: 'ワイングラス', marktree_fast: 'ウィンドチャイム（速く上る）', marktree_slow: 'ウィンドチャイム（ゆっくり上る）', marktree_desc: 'ウィンドチャイム（下る）',
  tubular_c4: 'チューブラーベル', tubular_c3: 'チューブラーベル（低）', handchime_c5: 'ハンドチャイム', vibes_a4: 'ビブラフォン', kalimba_a4: 'カリンバ', marimba_c6: 'マリンバ（高）', marimba_c2: 'マリンバ（低）',
  vibraslap: 'ビブラスラップ', guiro_hit: 'ギロ', ocean: 'オーシャンドラム', shaker_roll: 'シェイカー', cymbal_cresc: 'シンバル（だんだん大きく）', flexatone: 'フレクサトーン', anvil: '金床', brake: 'ブレーキドラム', handbell: 'ネパールの鈴',
};
const V = (...k) => k.map((x) => 'vc_' + x);
const R = (pre, from, to) => Array.from({ length: to - from + 1 }, (_, i) => `${pre}${from + i}`);
// 4回目：属性でまとめず、超能力1つずつに候補を並べた。どれも0.9秒で切って鳴らす
const W = (...k) => k.map((x) => 'el_' + x);
const SLOTS = [
  { id: 'spy', name: 'スパイ', hint: '相手の色で置く', files: [...W('ice1', 'ice2', 'ice4'), 'cc_weird_01', 'cc_weird_04', 'cc_other_01', ...V('finger_cym', 'flexatone', 'vibraslap', 'agogo_lo')] },
  { id: 'grow', name: '増殖', hint: '石が増える', files: [...W('plant1', 'plant2', 'plant3', 'plant4', 'plant5'), 'cc_plop_01', ...V('kalimba_a4', 'marimba_c6', 'wood_pp')] },
];
const PRE = { ex_: '爆発 ', nk_: '大爆発 ', ch_: 'ため ', el_fire: '炎 ', el_wind: '風 ', el_water: '水 ', el_earth: '大地 ', el_lightning: '雷 ', el_plant: '植物 ', el_heal: '光 ', el_gravity: '重力 ', el_emp: '電磁 ', el_ice: '氷 ', el_: '', cc_: '' };
const chosen = Object.fromEntries(SLOTS.map((s) => [s.id, new Set()]));
const cache = {};
function play(name, el) {
  const a = (cache[name] = cache[name] || new Audio(`sfx-candidates/${name}.ogg`));
  a.currentTime = 0; a.play();
  // 0.6秒からゆっくり小さくして、1.3秒で消す（ゲームと同じ消え方）
  clearInterval(a._fade); a.volume = 1;
  const t0 = performance.now();
  a._fade = setInterval(() => { const k = (performance.now() - t0 - 600) / 700; if (k <= 0) return; if (k >= 1) { a.pause(); clearInterval(a._fade); return; } a.volume = Math.cos(k * Math.PI / 2) ** 2; }, 30);
  if (el) { el.classList.remove('is-playing'); void el.offsetWidth; el.classList.add('is-playing'); }
}
const label = (f) => {
  if (f.startsWith('vc_')) return JA[f.slice(3)] || f;
  for (const [k, v] of Object.entries(PRE)) if (f.startsWith(k)) return v + f.slice(k.length).replace(/^_/, '').replace(/_0*(\d+)$/, ' $1');
  return f.replace('bfh1_', '').replace(/_0*(\d+)$/, ' $1');
};
document.getElementById('slots').innerHTML = SLOTS.map((s) => `<section data-slot="${s.id}">
  <h2>${s.name}</h2>${s.hint ? `<p class="hint">${s.hint}</p>` : ''}
  <div class="grid">${s.files.map((f) => `<button type="button" class="snd" data-file="${f}"><span class="play">▶</span>${label(f)}</button>`).join('')}</div>
</section>`).join('');
let last = null;
document.getElementById('slots').addEventListener('click', (e) => {
  const b = e.target.closest('.snd'); if (!b) return;
  const slot = b.closest('section').dataset.slot, f = b.dataset.file;
  play(f, b);
  // 同じ音を続けて押したら、選ぶ／外す
  if (last === b) { chosen[slot].has(f) ? chosen[slot].delete(f) : chosen[slot].add(f); b.classList.toggle('is-on', chosen[slot].has(f)); last = null; } else last = b;
  render();
});
function render() {
  const lines = SLOTS.filter((s) => chosen[s.id].size).map((s) => `${s.name}：${[...chosen[s.id]].join(', ')}`);
  document.getElementById('summary').textContent = lines.length ? lines.join('\n') : 'まだ選んでいません';
}
document.getElementById('copy').addEventListener('click', async () => {
  const t = document.getElementById('summary').textContent;
  try { await navigator.clipboard.writeText(t); document.getElementById('copy').textContent = 'コピーしました'; } catch (e) { /* コピーできなければ、表示をそのまま選んでもらう */ }
  setTimeout(() => (document.getElementById('copy').textContent = '選んだ結果をコピー'), 1500);
});
</script>
</body>
</html>
