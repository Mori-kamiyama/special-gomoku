      <button type="button" class="want" data-name="${i.name}" aria-label="${i.name}を入れたい" aria-pressed="${want.has(i.name)}">${want.has(i.name) ? '♥' : '♡'}</button>
    </div>`).join('');
  const list = [...want];
  document.getElementById('picked').textContent = list.length ? `入れたいもの ${list.length}個：${list.join('、')}` : 'まだ選んでいません';
}
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (chip) { filter = chip.dataset.k; render(); return; }
  const w = e.target.closest('.want');
  if (w) {
    const n = w.dataset.name;
    want.has(n) ? want.delete(n) : want.add(n);
    try { localStorage.setItem('gomoku-ideas-want', JSON.stringify([...want])); } catch (err) { /* 保存できなくても選べる */ }
    render();
  }
});
document.getElementById('copy').addEventListener('click', async () => {
  const text = '入れたい碁石：' + [...want].join('、');
  try { await navigator.clipboard.writeText(text); document.getElementById('copy').textContent = 'コピーしました'; } catch (e) { /* 表示から選んでもらう */ }
  setTimeout(() => (document.getElementById('copy').textContent = '入れたいものをコピー'), 1500);
});
render();
</script>
</body>
</html>
